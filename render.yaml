# Render Blueprint: the backend web service. Secrets are entered in the Render dashboard (sync: false),
# never committed. The frontend is deployed separately on Vercel (see docs/deployment_guide.md).
services:
  - type: web
    name: legal-help-api
    runtime: python
    region: singapore            # same region as the Neon database: every query is a network round trip
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: TRUST_PROXY           # Render sits behind a proxy; needed for per-user rate limits
        value: "1"
      - key: ALLOWED_ORIGINS       # your Vercel URL, e.g. https://legal-help.vercel.app (no trailing slash)
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: IKANOON_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
